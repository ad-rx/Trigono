            theme: {

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;

        .custom-scrollbar::-webkit-scrollbar {

        }

        }

            background: #94a3b8;

            50% {

            align-items: center;

            background: radial-gradient(ellipse at 50% 50%, #1e293b 0%, #0f172a 100%);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #login-overlay .login-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            max-width: 440px;
            width: 94%;
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            transition: transform 0.4s ease;
        }
        #login-overlay .login-card:hover {
            transform: scale(1.005);
        }
        .login-input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            border-radius: 1.25rem;
            padding: 0.85rem 1.25rem;
            font-size: 0.95rem;

            width: 100%;

        }
        .login-input:focus {

            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }
        .login-input::placeholder {

        }
        .login-btn {

            border-radius: 1.5rem;
            padding: 0.9rem 1.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 28px rgba(59, 130, 246, 0.35);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(59, 130, 246, 0.50);
        }
        .login-btn:active {
            transform: scale(0.97);
        }
        .login-error {

            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
            text-align: center;
            min-height: 1.25rem;
        }

        /* header user info */
        .user-badge {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 2rem;
            padding: 0.2rem 1rem 0.2rem 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;

        .user-badge .initial {

            border-radius: 50%;

            justify-content: center;

            font-size: 0.75rem;
            color: #fff;

            font-size: 0.8rem;
            color: #0f172a;

    <script>
        // ============================================================
        //  STORAGE KEYS
        // ============================================================
        const STORAGE_KEY_CURRENT = 'trigolab_current_user';
        const STORAGE_KEY_PROGRESS_PREFIX = 'trigolab_progress_';

        // ============================================================
        //  STATE (loaded from localStorage)
        // ============================================================
        let state = {
            xp: 0,
            streak: 0,
            badges: 0,
            completedModules: [],
            userName: '',
            userClass: '',
            activeMission: 'Telaah Fenomena Tiang Bendera',
            explorationAngle: 35,
            explorationBase: 10,
            calcMode: 'sin',
            evalScore: 0,
            simType: 'tiang',
            simDistance: 15,
            simAngle: 40,
            simEyeHeight: 1.6
        };

        // ============================================================
        //  STUDENT DATA HELPERS
        // ============================================================
        function getStudentKey(name, cls) {
            return STORAGE_KEY_PROGRESS_PREFIX + (name + '_' + cls).replace(/\s+/g, '_').toLowerCase();
        }

        function loadStudentData(name, cls) {
            const key = getStudentKey(name, cls);
            const raw = localStorage.getItem(key);
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    // merge with default state
                    return { ...state, ...data, userName: name, userClass: cls };
                } catch (_) { /* ignore */ }
            }
            // default new student
            return { ...state, userName: name, userClass: cls, xp: 0, streak: 0, badges: 0, completedModules: [] };
        }

        function saveStudentData(st) {
            const key = getStudentKey(st.userName, st.userClass);
            const toStore = { ...st };
            // don't store these keys separately (they're already in the key)
            // but we keep them for display
            localStorage.setItem(key, JSON.stringify(toStore));
            // also store current user
            localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify({ name: st.userName, class: st.userClass }));
        }

        function getCurrentUser() {
            const raw = localStorage.getItem(STORAGE_KEY_CURRENT);
            if (raw) {
                try { return JSON.parse(raw); } catch (_) { /* ignore */ }
            }
            return null;
        }

        // ============================================================
        //  LOGIN / LOGOUT
        // ============================================================
        function loginStudent(name, cls) {
            if (!name.trim() || !cls.trim()) {
                document.getElementById('login-error').textContent = 'Nama dan Kelas wajib diisi!';
                return false;
            }
            // load or init state
            const loaded = loadStudentData(name.trim(), cls.trim());
            Object.assign(state, loaded);
            saveStudentData(state);
            updateUI();
            document.getElementById('login-overlay').classList.add('hidden');
            router.navigate('dashboard');
            return true;
        }

        function logoutStudent() {
            // save current state first
            saveStudentData(state);
            localStorage.removeItem(STORAGE_KEY_CURRENT);
            // reset state to defaults
            Object.assign(state, { xp: 0, streak: 0, badges: 0, completedModules: [], userName: '', userClass: '' });
            updateUI();
            document.getElementById('login-overlay').classList.remove('hidden');

            document.getElementById('stat-badges').textContent = state.badges;

            document.getElementById('overall-progress-bar').style.width = pct + '%';

            const initial = (state.userName || '?').substring(0, 2).toUpperCase() || '?';

            document.getElementById('user-display-name').textContent = state.userName || '—';
            document.getElementById('user-display-class').textContent = state.userClass || '—';

            if (state.completedModules.length === 0) {
                document.getElementById('sidebar-mission-desc').textContent = 'Mulai petualanganmu dari Misi Telaah!';

                document.getElementById('sidebar-mission-desc').textContent = '🎉 Selamat! Kamu telah menyelesaikan semua misi!';
            } else {
                const next = getNextMission();
                document.getElementById('sidebar-mission-desc').textContent = next ? next.desc : 'Jelajahi semua misi!';
            }
        }

        function getNextMission() {
            const all = ['telaah', 'eksplorasi', 'rumuskan', 'presentasikan', 'aplikasikan', 'duniawi', 'ukhrowi'];
            const done = state.completedModules || [];
            for (const m of all) {
                if (!done.includes(m)) {
                    const names = {
                        telaah: { desc: 'Telaah — Amati fenomena tiang bendera' },
                        eksplorasi: { desc: 'Eksplorasi — Lab segitiga interaktif' },
                        rumuskan: { desc: 'Rumuskan — Temukan pola Sin/Cos/Tan' },
                        presentasikan: { desc: 'Presentasikan — Urutan langkah berpikir' },
                        aplikasikan: { desc: 'Aplikasikan — Simulasi 5 benda nyata' },
                        duniawi: { desc: 'Duniawi — Penerapan di teknologi & profesi' },
                        ukhrowi: { desc: 'Ukhrowi — Refleksi keteraturan ciptaan' }
                    };
                    return names[m] || { desc: 'Lanjutkan misi berikutnya' };
                }
            }
            return null;
        }

        function addXP(amount, missionName) {
            state.xp += amount;
            if (missionName && !state.completedModules.includes(missionName)) {
                state.completedModules.push(missionName);
                state.badges += 1;
                // bonus streak logic (simplified)
                state.streak += 1;
            }
            saveStudentData(state);
            updateUI();
            showToast(`+${amount} XP 🏆 Badge ditambahkan!`);
        }

            toast.innerHTML =

            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        let currentMode = 'sin';

        function initEksplorasiCanvas() { updateExploration(35); }

        function setCalcMode(mode) {
            currentMode = mode;
            ['sin', 'cos', 'tan'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (m === mode) { btn.className =
                        'px-3 py-1.5 rounded-xl font-bold text-xs transition bg-cyan-600 text-white shadow'; } else { btn
                        .className = 'px-3 py-1.5 rounded-xl font-bold text-xs transition bg-white text-slate-700 border border-slate-200'; }
            });
            updateExploration(document.getElementById('angle-slider').value);
        }

        function updateExploration(angleDeg) {
            const angleRad = angleDeg * (Math.PI / 180);
            document.getElementById('val-theta').innerText = `${angleDeg}°`;
            document.getElementById('slider-val-display').innerText = `${angleDeg}°`;
            document.getElementById('label-theta').innerHTML = `θ (${angleDeg}°)`;
            const baseLen = 140;
            const oppLen = Math.round(baseLen * Math.tan(angleRad) * 10) / 10;
            const hypLen = Math.round(Math.sqrt(baseLen * baseLen + oppLen * oppLen) * 10) / 10;
            const height = Math.min(130, Math.max(30, oppLen * 1.2));
            const yTop = 180 - height;
            const poly = document.getElementById('tri-polygon');
            if (poly) poly.setAttribute('points', `50,180 230,180 230,${yTop}`);
            let ratioVal = 0,
                ratioTitle = '';

          `;

        function initKalkulatorScript() {}

        function calculateProcess() {
            const angle = parseFloat(document.getElementById('calc-angle-input').value);
            const func = document.getElementById('calc-func-select').value;
            const box = document.getElementById('calc-result-box');
            const out = document.getElementById('calc-output-text');
            box.classList.remove('hidden');
            const rad = angle * (Math.PI / 180);
            let val = 0;
            if (func === 'sin') val = Math.sin(rad);
            else if (func === 'cos') val = Math.cos(rad);
            else val = Math.tan(rad);
            out.innerHTML =
                `Operasi: <strong>${func}(${angle}°)</strong><br>Sudut dalam radian: ${rad.toFixed(4)} rad<br>Hasil kalkulasi: <strong>${val.toFixed(4)}</strong><br><br><em>Catatan: Gunakan nilai ini untuk mencari panjang sisi dengan mengalikannya dengan sisi yang diketahui (misal: Sisi Depan = ${func}(${angle}°) × Sisi Miring).</em>`;
        }

        // ============================================================
        //  INITIALIZATION
        // ============================================================
        function initApp() {
            // check if user already logged in
            const current = getCurrentUser();
            if (current && current.name && current.class) {
                const loaded = loadStudentData(current.name, current.class);
                Object.assign(state, loaded);
                document.getElementById('login-overlay').classList.add('hidden');
                updateUI();
                router.navigate('dashboard');
            } else {
                // show login
                document.getElementById('login-overlay').classList.remove('hidden');
                // ensure no stale state
                Object.assign(state, { xp: 0, streak: 0, badges: 0, completedModules: [], userName: '', userClass: '' });
                updateUI();
            }

            // Login form handler
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const name = document.getElementById('login-name').value.trim();
                const cls = document.getElementById('login-class').value.trim();
                if (loginStudent(name, cls)) {
                    // success, overlay hidden inside loginStudent
                }
            });

            // Logout button
            document.getElementById('logout-btn-header').addEventListener('click', function() {
                if (confirm('Yakin ingin keluar? Progress akan tetap tersimpan.')) {
                    logoutStudent();
                }
            });

            // Sidebar toggle
            document.getElementById('sidebar-toggle').addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
            });
        }

        // Override router.navigate to ensure state is saved on view change
        const originalNavigate = router.navigate;
        router.navigate = function(viewName) {
            // save state before switching views
            if (state.userName) saveStudentData(state);
            originalNavigate.call(this, viewName);
        };

        // Start
        window.onload = function() {
            initApp();
        };
